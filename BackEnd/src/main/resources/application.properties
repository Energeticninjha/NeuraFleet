spring.application.name=neurafleet-backend

# MySQL Connection (Double check your password!)
spring.datasource.url=jdbc:mysql://localhost:3306/neurafleet_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate - This is what creates your tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security Bypass for testing
spring.security.user.name=admin
spring.security.user.password=admin123