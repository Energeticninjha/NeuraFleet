<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 350px; border-radius: 15px;">
    <h3 class="text-center mb-4 text-primary fw-bold">NeuraFleet Login</h3>
    
<div class="mb-3">
      <label class="form-label fw-semibold">Username</label>
      <input type="text" [(ngModel)]="loginData.username" 
             class="form-control" 
             [class.is-invalid]="submitted && !loginData.username"
             placeholder="Enter username">
      <div *ngIf="submitted && !loginData.username" class="text-danger small mt-1">
        Please enter your username.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Password</label>
      <input type="password" [(ngModel)]="loginData.password" 
             class="form-control" 
             [class.is-invalid]="submitted && !loginData.password"
             placeholder="Enter password">
      <div *ngIf="submitted && !loginData.password" class="text-danger small mt-1">
        Please enter your password.
      </div>
    </div>

 <div class="mb-3">
  <label class="form-label fw-semibold">Login As</label>
  <select name="role" [(ngModel)]="loginData.role" class="form-select">
    <option value="ADMIN">Admin</option> <option value="FLEET_MANAGER">Fleet Manager</option>
    <option value="DRIVER">Driver</option>
    <option value="CUSTOMER">Customer</option>
  </select>
</div>
<div *ngIf="errorMessage" class="alert alert-danger p-2 small text-center" role="alert">
  {{ errorMessage }}
</div>
   <button (click)="login()" class="btn btn-primary w-100 mb-3 shadow-sm">Sign In</button>

    <div class="text-center mt-2">
      <small class="text-muted">New to NeuraFleet? 
        <a routerLink="/register" class="text-decoration-none fw-bold">Create an account</a>
      </small>
    </div>
  </div>
</div>
